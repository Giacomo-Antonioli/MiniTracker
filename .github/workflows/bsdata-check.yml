name: BSData check
# Daily: is the BSData 40k link still valid, and does our parser still read it correctly?
# Opens an issue on failure; closes it when the check passes again.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['src/data/catalogue/**', 'tools/**', '.github/workflows/bsdata-check.yml']
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # BSData removed its repositories after a copyright notice (2026-11-12). While the source is gone there is
      # nothing to check: say so and stop, instead of opening an issue every day. It runs again by itself if it returns.
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BSData/wh40k-10e || true)
          # Only "not found" / "legally blocked" count as gone; any other failure still runs the check and fails loudly.
          if [ "$CODE" = "404" ] || [ "$CODE" = "451" ]; then
            echo "gone=true" >> "$GITHUB_OUTPUT"
            echo "::warning::BSData/wh40k-10e answers HTTP $CODE (removed from GitHub?). Check skipped."
          else
            echo "gone=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.probe.outputs.gone != 'true'
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - if: steps.probe.outputs.gone != 'true'
        run: npm ci
      - id: live
        if: steps.probe.outputs.gone != 'true'
        run: npm run check:bsdata
        env:
          # Avoids GitHub API rate limits on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open an issue on failure
        if: failure() && steps.probe.outputs.gone != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OPEN=$(gh issue list --label bsdata-check --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still failing on $(date -u +%F): $RUN"
          else
            gh issue create --label bsdata-check --title "BSData check failing" \
              --body "The daily check against BSData/wh40k-10e failed: $RUN

          The catalogue download in the app may be broken (repo moved or renamed, files changed, or the parser needs updating)."
          fi
      - name: Close the issue when fixed
        if: success() && steps.probe.outputs.gone != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label bsdata-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "BSData check passing again on $(date -u +%F)."
          done

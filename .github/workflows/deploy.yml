name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, to refresh the copy of the One Page Rules army books.
  schedule:
    - cron: '41 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Added to the built site only (after the build, so the offline cache doesn't include them).
      - name: Copy the One Page Rules army books
        run: node tools/opr/mirror.mjs dist/opr https://giacomo-antonioli.github.io/MiniTracker/opr
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

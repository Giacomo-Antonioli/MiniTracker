name: Release
# Push a tag like v0.2.0 to publish a GitHub release.
# Notes come from that version's section in CHANGELOG.md; a zip of the built app is attached.
# The desktop job (#168) then builds the Linux, Windows and macOS installers and adds them to the release.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "Tag v$TAG does not match package.json $PKG"; exit 1; fi
      - run: npm run test:coverage
      - run: npm run build
      - name: Extract release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[.*\]: / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $V"; exit 1; fi
          printf '\n**Live app:** https://giacomo-antonioli.github.io/MiniTracker/\n' >> notes.md
          printf '\n**Desktop app:** installers below (Windows .msi/.exe, macOS .dmg, Linux .deb/.AppImage). They are not code-signed yet: on Windows choose *More info › Run anyway*; on macOS right-click the app › *Open*.\n' >> notes.md
      - name: Package built app
        run: cd dist && zip -qr "../minitracker-${GITHUB_REF_NAME}-web.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "minitracker-${GITHUB_REF_NAME}-web.zip" \
            --title "MiniTracker $GITHUB_REF_NAME" --notes-file notes.md $PRE

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles msi,nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - name: Add installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob globstar
          files=(src-tauri/target/**/bundle/{deb,appimage,msi,nsis,dmg}/*.{deb,AppImage,msi,exe,dmg})
          if [ ${#files[@]} -eq 0 ]; then echo "No installers built"; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

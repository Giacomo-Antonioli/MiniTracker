name: Desktop
# Builds the Linux desktop package (#168) on pull requests that touch the desktop app, so it can't break unseen.
on:
  pull_request:
    paths: ['src-tauri/**', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/desktop.yml']
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx tauri build --bundles deb

[package]
name = "minitracker"
version = "0.0.0"
description = "MiniTracker desktop and Android app (#168)"
authors = ["Giacomo Antonioli"]
license-file = "../LICENSE.md"
repository = "https://github.com/Giacomo-Antonioli/MiniTracker"
publish = false
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "minitracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
mdns-sd = "0.21.7"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["net", "sync", "macros", "rt", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
